<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Open Shift Rail — Restaurant Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #191D1A;
    --panel: #232823;
    --panel-light: #2B302B;
    --paper: #F0EAD8;
    --ink: #23261F;
    --rail: #454C46;
    --text-bright: #F3F0E7;
    --text-dim: #9BA39C;
    --hiring: #6E8FAE;
    --training: #8C6FA0;
    --scheduling: #E2A33B;
    --payroll: #5C8C6B;
    --comms: #4A9B95;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text-bright);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Oswald', sans-serif; }
  .num { font-family: 'IBM Plex Mono', monospace; }

  #shell {
    display: flex;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 216px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--rail);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 20px;
  }
  .brand-mark {
    width: 30px; height: 30px;
    border: 2px solid var(--scheduling);
    border-radius: 6px;
    transform: rotate(-4deg);
    display: flex; align-items: center; justify-content: center;
    color: var(--scheduling);
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .brand-name {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .nav-stub {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px 11px 14px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    background-image: repeating-linear-gradient(to bottom, transparent 0 5px, rgba(255,255,255,0.06) 5px 6px);
    background-size: 100% 11px;
    background-position: left;
    background-repeat: no-repeat;
    background-size: 3px 100%;
  }
  .nav-stub .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--dot-color, var(--text-dim));
  }
  .nav-stub:hover { background-color: var(--panel-light); color: var(--text-bright); }
  .nav-stub.active {
    background-color: var(--panel-light);
    color: var(--text-bright);
    border-color: var(--rail);
  }
  .nav-stub.active::after {
    content: "";
    position: absolute;
    left: -1px; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--dot-color, var(--scheduling));
  }
  .nav-divider {
    height: 1px;
    background: var(--rail);
    margin: 10px 4px;
  }

  /* ---------- main ---------- */
  #main { flex: 1; min-width: 0; }
  #topbar {
    border-bottom: 1px solid var(--rail);
    padding: 16px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  #topbar h1 { font-size: 19px; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600; }
  .demo-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border: 1px solid var(--rail);
    padding: 4px 9px;
    border-radius: 20px;
  }
  #content { padding: 26px 28px 60px; max-width: 980px; }
  .module-panel { display: none; }
  .module-panel.active { display: block; }

  .module-header { margin-bottom: 22px; }
  .module-header .eyebrow {
    color: var(--accent, var(--text-dim));
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .module-header h2 { font-size: 24px; margin: 0 0 6px; }
  .module-header p { color: var(--text-dim); font-size: 13.5px; margin: 0; max-width: 60ch; line-height: 1.5; }

  /* ---------- ticket stub (shared signature card) ---------- */
  .stub {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 16px 16px 14px;
    margin-bottom: 14px;
    background-image: repeating-linear-gradient(to right, transparent 0 6px, rgba(0,0,0,0.07) 6px 7px);
    background-size: 13px 100%;
    background-position: top;
    background-repeat: repeat-x;
  }
  .stub .tag {
    position: absolute;
    top: 12px; right: 14px;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 1px 7px;
    border-radius: 3px;
    transform: rotate(-6deg);
  }
  .stub h3 { font-size: 16px; margin: 0 0 4px; padding-right: 76px; }
  .stub .meta { font-size: 11.5px; opacity: 0.65; margin-bottom: 8px; }
  .stub .body-text { font-size: 13.5px; line-height: 1.5; }
  .stub .stub-actions {
    display: flex; gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(35,38,31,0.25);
  }
  .stub button.mini {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn-solid { background: var(--accent); color: #fff; }
  .btn-outline { background: transparent; border: 1px solid rgba(35,38,31,0.3) !important; color: var(--ink); }

  /* overview grid */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .overview-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 18px 16px;
    cursor: pointer;
    position: relative;
    background-image: repeating-linear-gradient(to right, transparent 0 6px, rgba(0,0,0,0.07) 6px 7px);
    background-size: 13px 100%;
    background-position: top;
    background-repeat: repeat-x;
    transition: transform 0.12s ease;
  }
  .overview-card:hover { transform: translateY(-2px); }
  .overview-card .corner {
    position: absolute; top: 12px; right: 12px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .overview-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 8px; }
  .overview-card .big-num { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; line-height: 1; }
  .overview-card .sub { font-size: 12.5px; opacity: 0.7; margin-top: 6px; }

  /* progress bars (training) */
  .progress-track {
    background: rgba(35,38,31,0.12);
    border-radius: 20px;
    height: 6px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 20px; }
  .video-thumb {
    width: 54px; height: 38px;
    border-radius: 4px;
    background: var(--accent);
    opacity: 0.35;
    flex-shrink: 0;
  }
  .stage-pill {
    display: inline-block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(35,38,31,0.1);
    font-weight: 600;
  }

  /* payroll table-ish */
  .pay-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px dashed rgba(35,38,31,0.2);
    font-size: 13.5px;
  }
  .pay-row:last-child { border-bottom: none; }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 120px;
    margin: 6px 0 4px;
  }
  .bar-chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar-chart .bar {
    width: 100%;
    max-width: 34px;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
    opacity: 0.85;
  }
  .bar-chart .bar-label { font-size: 10.5px; color: var(--text-dim); }

  /* comms thread */
  .thread-msg { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
  .avatar-dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel-light);
    border: 1px solid var(--rail);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .thread-bubble {
    background: var(--panel-light);
    border: 1px solid var(--rail);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13.5px;
    max-width: 420px;
  }
  .thread-name { font-size: 11.5px; color: var(--text-dim); margin-bottom: 2px; }

  input[type=text], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--rail);
    color: var(--text-bright);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
  }
  button.primary-action {
    background: var(--accent, var(--scheduling));
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  @media (max-width: 760px) {
    #shell { flex-direction: column; }
    #sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      padding: 12px;
      gap: 8px;
      border-right: none;
      border-bottom: 1px solid var(--rail);
    }
    .brand { display: none; }
    .nav-divider { display: none; }
    .nav-stub { flex-shrink: 0; white-space: nowrap; }
    #content { padding: 20px 16px 50px; }
  }

  /* ---------- portfolio (multi-restaurant) view ---------- */
  #backToPortfolio {
    background: none;
    border: 1px solid var(--rail);
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #backToPortfolio:hover { color: var(--text-bright); border-color: var(--text-bright); }
  #portfolioTopbar {
    padding: 24px 32px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .portfolio-eyebrow { color: var(--text-dim); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  #portfolioTopbar h1 { font-size: 26px; margin: 0; text-transform: none; }
  #portfolioContent { padding: 10px 32px 60px; max-width: 1040px; }
  .restaurant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .restaurant-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 18px 18px 16px;
    cursor: pointer;
    position: relative;
    background-image: repeating-linear-gradient(to right, transparent 0 6px, rgba(0,0,0,0.07) 6px 7px);
    background-size: 13px 100%;
    background-position: top;
    background-repeat: repeat-x;
    transition: transform 0.12s ease;
  }
  .restaurant-card:hover { transform: translateY(-2px); }
  .restaurant-card .status-tag {
    position: absolute; top: 14px; right: 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 3px;
    border: 2px solid;
    transform: rotate(-5deg);
  }
  .status-tag.ok { color: var(--payroll); border-color: var(--payroll); }
  .status-tag.attention { color: var(--scheduling); border-color: var(--scheduling); }
  .restaurant-card h3 { font-size: 17px; margin: 0 0 2px; padding-right: 90px; }
  .restaurant-card .city { font-size: 12px; opacity: 0.6; margin-bottom: 14px; }
  .restaurant-card .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-top: 1px dashed rgba(35,38,31,0.2);
  }
  .restaurant-card .stat-row:first-of-type { border-top: none; }
  .restaurant-card .note {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.75;
    line-height: 1.4;
  }
  .portfolio-totals {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .portfolio-totals .total-item .num { font-size: 22px; font-weight: 600; display: block; }
  .portfolio-totals .total-item .label { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>

<div id="portfolioView">
  <div id="portfolioTopbar">
    <div>
      <div class="portfolio-eyebrow">Your restaurants</div>
      <h1>Good morning</h1>
    </div>
    <span class="demo-badge">Sample data · demo</span>
  </div>
  <div id="portfolioContent"></div>
</div>

<div id="shell" style="display:none">
  <nav id="sidebar"></nav>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button id="backToPortfolio" onclick="showPortfolio()">← All restaurants</button>
        <h1 id="topbarTitle">Overview</h1>
      </div>
      <span class="demo-badge">Sample data · demo</span>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
const RESTAURANTS = [
  { id: "pigeon-old-montreal", name: "Pigeon Cafe Old Montreal", city: "Old Montreal", weekSales: 18420, laborPct: 29, openShifts: 2, status: "attention", note: "AI flagged Saturday lunch as short-staffed." },
  { id: "pigeon-downtown", name: "Pigeon Cafe Downtown", city: "Downtown Montreal", weekSales: 24110, laborPct: 24, openShifts: 0, status: "ok", note: "Fully staffed, on target for the week." },
  { id: "tzatziqui", name: "Tzatzi-qui", city: "Montreal", weekSales: 14870, laborPct: 34, openShifts: 3, status: "attention", note: "Labor cost is running high for sales volume." },
  { id: "souvlaki-laval", name: "Souvlaki Bar Laval", city: "Laval", weekSales: 21200, laborPct: 26, openShifts: 1, status: "ok", note: "One open shift, already has 2 responses." },
  { id: "shay", name: "Shay", city: "Montreal", weekSales: 16340, laborPct: 27, openShifts: 0, status: "ok", note: "Fully staffed, on target for the week." },
  { id: "sergiolino", name: "SergioLino", city: "Montreal", weekSales: 12980, laborPct: 31, openShifts: 2, status: "attention", note: "Two open shifts posted less than an hour ago." },
];

const MODULES = [
  { id: "overview", label: "Overview", color: null },
  { id: "hiring", label: "Hiring", color: "var(--hiring)" },
  { id: "training", label: "Training", color: "var(--training)" },
  { id: "scheduling", label: "Scheduling", color: "var(--scheduling)" },
  { id: "payroll", label: "Payroll & Sales", color: "var(--payroll)" },
  { id: "comms", label: "Communications", color: "var(--comms)" },
];

const DATA = {
  hiring: [
    { name: "Priya Nandan", role: "Line Cook", stage: "Interview scheduled", applied: "2 days ago", note: "3 yrs experience, available weekends", aiScore: 88, interview: "Thu 2:00 PM" },
    { name: "Marcus Webb", role: "Server", stage: "Screening", applied: "6 hours ago", note: "Referred by Alex R.", aiScore: 74, interview: null },
    { name: "Dana Okafor", role: "Host", stage: "Offer sent", applied: "5 days ago", note: "Start date flexible", aiScore: 91, interview: "Completed" },
    { name: "Theo Marchetti", role: "Bartender", stage: "Applied", applied: "1 day ago", note: "Portfolio of cocktail menus attached", aiScore: null, interview: null },
  ],
  training: {
    courses: [
      { title: "Onboarding Basics", assigned: 8, completed: 6, minutes: 22 },
      { title: "Food Safety Certification", assigned: 8, completed: 3, minutes: 45 },
      { title: "POS System Walkthrough", assigned: 5, completed: 5, minutes: 15 },
      { title: "Customer De-escalation", assigned: 8, completed: 1, minutes: 18 },
    ],
    documents: [
      { title: "Employee Handbook 2026", type: "Manual", status: "Acknowledged by 7/8" },
      { title: "Employment Contract — Priya Nandan", type: "Contract", status: "Signed" },
      { title: "Employment Contract — Marcus Webb", type: "Contract", status: "Pending signature" },
      { title: "Health & Safety Policy", type: "Manual", status: "Acknowledged by 8/8" },
    ],
  },
  scheduling: {
    forecast: {
      headline: "Saturday lunch may be understaffed",
      detail: "Last year's Saturday sales rose 22% during the Riverside Farmers Market, two blocks from you. It's back this Saturday, and no extra coverage is scheduled yet.",
      suggestion: "Add 1 extra server to the 11am–3pm block.",
    },
    shifts: [
      { role: "Server", time: "Today, 5pm–close", note: "Jordan called out sick", responders: 1, status: "open" },
      { role: "Dishwasher", time: "Tomorrow, 11am–4pm", note: "", responders: 0, status: "open" },
      { role: "Line Cook", time: "Fri, 4pm–close", note: "Covered by Priya N.", responders: 2, status: "filled" },
    ],
  },
  payroll: {
    weekSales: 18420,
    weeklySalesTrend: [11200, 13800, 12100, 15600, 14200, 18420, 9800],
    pnl: { foodCostPct: 31, bevCostPct: 19, laborCostPct: 29, netMarginPct: 21 },
    forecast: { nextPeriodEstimate: 9800, note: "Based on scheduled hours plus this month's average tenure raises" },
    staffPay: [
      { name: "Priya Nandan", hours: 34, rate: 19, role: "Line Cook" },
      { name: "Alex Rivera", hours: 28, rate: 17, role: "Server" },
      { name: "Sam Okafor", hours: 40, rate: 21, role: "Bartender" },
    ],
  },
  comms: {
    aiThread: [
      { role: "user", text: "Which shift is understaffed this week?" },
      { role: "ai", text: "Saturday lunch (11am–3pm) is short one server. Last year's sales jumped 22% that week from the nearby farmers market, and it's back this Saturday — no extra coverage is scheduled yet. Priya and Sam are both usually free that block." },
    ],
    thread: [
      { name: "Priya Nandan", text: "Can I swap my Friday shift with someone? Family thing came up.", time: "9:14 AM", mine: false },
      { name: "You", text: "Sure — I'll post it as an open shift so anyone can pick it up.", time: "9:20 AM", mine: true },
      { name: "Sam Okafor", text: "I can take Friday if it's still open!", time: "9:31 AM", mine: false },
    ],
  },
};

let active = "overview";
let currentRestaurantName = "Open Shift Rail";


function renderSidebar() {
  const nav = document.getElementById("sidebar");
  nav.innerHTML = `
    <div class="brand">
      <div class="brand-mark">OSR</div>
      <div class="brand-name">${currentRestaurantName}</div>
    </div>
    ${MODULES.map((m, i) => `
      ${i === 1 ? '<div class="nav-divider"></div>' : ""}
      <div class="nav-stub${active === m.id ? " active" : ""}" style="--dot-color:${m.color || "var(--text-dim)"}" onclick="setActive('${m.id}')">
        ${m.color ? `<span class="dot"></span>` : ""}
        <span>${m.label}</span>
      </div>
    `).join("")}
  `;
}

function setActive(id) {
  active = id;
  renderSidebar();
  document.getElementById("topbarTitle").textContent = MODULES.find(m => m.id === id).label;
  document.querySelectorAll(".module-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + id));
}

function renderOverview() {
  const stats = [
    { id: "hiring", label: "Open applications", value: DATA.hiring.filter(h => h.stage !== "Offer sent").length, sub: `${DATA.hiring.length} total in pipeline` },
    { id: "training", label: "Courses in progress", value: DATA.training.courses.filter(t => t.completed < t.assigned).length, sub: `${DATA.training.courses.length} courses · ${DATA.training.documents.length} documents` },
    { id: "scheduling", label: "Open shifts", value: DATA.scheduling.shifts.filter(s => s.status === "open").length, sub: `AI flagged Saturday as short-staffed` },
    { id: "payroll", label: "Sales this week", value: "$" + DATA.payroll.weekSales.toLocaleString(), sub: `${DATA.payroll.pnl.laborCostPct}% labor cost` },
    { id: "comms", label: "Unread messages", value: 2, sub: `Ask the AI agent anything` },
  ];
  return `
    <div class="module-header">
      <div class="eyebrow">Overview</div>
      <h2>This week, at a glance</h2>
      <p>Every module below feeds this dashboard — tap a card to open it.</p>
    </div>
    <div class="overview-grid">
      ${stats.map(s => `
        <div class="overview-card" style="--accent:var(--${s.id})" onclick="setActive('${s.id}')">
          <div class="corner"></div>
          <div class="label">${s.label}</div>
          <div class="big-num">${s.value}</div>
          <div class="sub">${s.sub}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderHiring() {
  return `
    <div class="module-header" style="--accent:var(--hiring)">
      <div class="eyebrow">Hiring</div>
      <h2>Applicant pipeline</h2>
      <p>Post an opening, let the system screen resumes against the role, then schedule interviews without leaving the pipeline.</p>
    </div>
    <button class="primary-action" style="--accent:var(--hiring);margin-bottom:18px" onclick="alert('In the full product, this opens a job-post form.')">Post a job opening</button>
    ${DATA.hiring.map(c => `
      <div class="stub">

function renderComms() {
  return `
    <div class="module-header" style="--accent:var(--comms)">
      <div class="eyebrow">Communications</div>
      <h2>Team messages & AI agent</h2>
      <p>One inbox for your team, plus an agent that can see across hiring, training, scheduling, and payroll to actually answer questions — not just relay messages.</p>

      <div class="tag" style="--accent:var(--comms)">AI agent</div>

      <div style="margin-top:14px">

          <div class="thread-msg" style="${m.mine ? 'flex-direction:row-reverse' : ''}">

      <textarea rows="3" placeholder="e.g. Kitchen closes early this Sunday for inventory — plan accordingly." style="margin-top:10px"></textarea>

function renderAiThread() {
  return DATA.comms.aiThread.map(m => `
    <div class="thread-msg" style="${m.role === 'user' ? 'flex-direction:row-reverse' : ''}">
      <div class="avatar-dot" style="${m.role === 'ai' ? 'background:var(--comms);color:#fff;border-color:var(--comms)' : ''}">${m.role === 'ai' ? 'AI' : 'You'}</div>
      <div>
        <div class="thread-bubble" style="${m.role === 'user' ? 'background:var(--comms);color:#fff;border-color:var(--comms)' : ''}">${m.text}</div>
      </div>
    </div>
  `).join("");
}

function generateAiResponse(q) {
  const lower = q.toLowerCase();
  if (/cost|margin|labor|food|beverage|profit/.test(lower)) {
    const p = DATA.payroll.pnl;
    return `This week: food cost ${p.foodCostPct}%, beverage cost ${p.bevCostPct}%, labor cost ${p.laborCostPct}% — net margin around ${p.netMarginPct}%. Labor's the largest lever right now.`;
  }
  if (/shift|staff|schedul|cover|understaff/.test(lower)) {
    return DATA.scheduling.forecast.detail + " " + DATA.scheduling.forecast.suggestion;
  }
  if (/train|course|onboard|manual|contract/.test(lower)) {
    const c = DATA.training.courses;
    const behind = c.filter(t => t.completed < t.assigned).map(t => t.title).join(", ");
    return `${behind ? `Still catching up on: ${behind}.` : "Everyone's caught up on assigned courses."} One contract is still waiting on a signature in Training.`;
  }
  if (/hir|candidate|applicant|interview|posting/.test(lower)) {
    const open = DATA.hiring.filter(h => h.stage !== "Offer sent").length;
    return `${open} candidates are still active in the pipeline. Dana Okafor's offer is out for Host, and Priya Nandan has an interview scheduled for Line Cook.`;
  }
  return "I can pull from hiring, training, scheduling, and payroll to answer that — try asking about staffing, labor cost, or who's behind on training.";
}

function askAgent() {
  const input = document.getElementById("aiInput");
  const question = input.value.trim();
  if (!question) return;
  DATA.comms.aiThread.push({ role: "user", text: question });
  DATA.comms.aiThread.push({ role: "ai", text: generateAiResponse(question) });
  input.value = "";
  document.getElementById("aiThreadWrap").innerHTML = renderAiThread();
}

function renderAll() {
  document.getElementById("content").innerHTML = `
    <div class="module-panel active" id="panel-overview">${renderOverview()}</div>
    <div class="module-panel" id="panel-hiring">${renderHiring()}</div>
    <div class="module-panel" id="panel-training">${renderTraining()}</div>
    <div class="module-panel" id="panel-scheduling">${renderScheduling()}</div>
    <div class="module-panel" id="panel-payroll">${renderPayroll()}</div>
    <div class="module-panel" id="panel-comms">${renderComms()}</div>
  `;
}

function renderPortfolio() {
  const totalSales = RESTAURANTS.reduce((sum, r) => sum + r.weekSales, 0);
  const totalOpenShifts = RESTAURANTS.reduce((sum, r) => sum + r.openShifts, 0);
  const needingAttention = RESTAURANTS.filter(r => r.status === "attention").length;

  document.getElementById("portfolioContent").innerHTML = `
    <div class="portfolio-totals">
      <div class="total-item"><span class="num">$${totalSales.toLocaleString()}</span><span class="label">Combined sales this week</span></div>
      <div class="total-item"><span class="num">${totalOpenShifts}</span><span class="label">Open shifts across locations</span></div>
      <div class="total-item"><span class="num">${needingAttention}</span><span class="label">Locations needing attention</span></div>
    </div>
    <div class="restaurant-grid">
      ${RESTAURANTS.map(r => `
        <div class="restaurant-card" onclick="enterRestaurant('${r.id}')">
          <div class="status-tag ${r.status}">${r.status === "ok" ? "On track" : "Attention"}</div>
          <h3>${r.name}</h3>
          <div class="city">${r.city}</div>
          <div class="stat-row"><span>Sales this week</span><span class="num">$${r.weekSales.toLocaleString()}</span></div>
          <div class="stat-row"><span>Labor cost</span><span class="num">${r.laborPct}%</span></div>
          <div class="stat-row"><span>Open shifts</span><span class="num">${r.openShifts}</span></div>
          <div class="note">${r.note}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function showPortfolio() {
  document.getElementById("shell").style.display = "none";
  document.getElementById("portfolioView").style.display = "block";
}

function enterRestaurant(id) {
  const r = RESTAURANTS.find(x => x.id === id);
  currentRestaurantName = r.name;
  document.getElementById("portfolioView").style.display = "none";
  document.getElementById("shell").style.display = "flex";
  setActive("overview");
}

renderPortfolio();
renderSidebar();
renderAll();
</script>
