<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Open Shift Rail — Restaurant Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #191D1A;
    --panel: #232823;
    --panel-light: #2B302B;
    --paper: #F0EAD8;
    --ink: #23261F;
    --rail: #454C46;
    --text-bright: #F3F0E7;
    --text-dim: #9BA39C;
    --hiring: #6E8FAE;
    --training: #8C6FA0;
    --scheduling: #E2A33B;
    --payroll: #5C8C6B;
    --comms: #4A9B95;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text-bright);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Oswald', sans-serif; }
  .num { font-family: 'IBM Plex Mono', monospace; }

  #shell {
    display: flex;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 216px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--rail);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 20px;
  }
  .brand-mark {
    width: 30px; height: 30px;
    border: 2px solid var(--scheduling);
    border-radius: 6px;
    transform: rotate(-4deg);
    display: flex; align-items: center; justify-content: center;
    color: var(--scheduling);
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .brand-name {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .nav-stub {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px 11px 14px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    background-color: transparent;
  }
  .nav-stub .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--dot-color, var(--text-dim));
  }
  .nav-stub:hover { background-color: var(--panel-light); color: var(--text-bright); }
  .nav-stub.active {
    background-color: var(--panel-light);
    color: var(--text-bright);
    border-color: var(--rail);
  }
  .nav-stub.active::after {
    content: "";
    position: absolute;
    left: -1px; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--dot-color, var(--scheduling));
  }
  .nav-divider {
    height: 1px;
    background: var(--rail);
    margin: 10px 4px;
  }

  /* ---------- lang switcher ---------- */
  .lang-switch {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .lang-btn {
    background: none;
    border: 1px solid var(--rail);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .lang-btn.active { background: var(--scheduling); color: var(--ink); border-color: var(--scheduling); }

  /* ---------- main ---------- */
  #main { flex: 1; min-width: 0; }
  #topbar {
    border-bottom: 1px solid var(--rail);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  #topbar h1 { font-size: 19px; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .demo-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border: 1px solid var(--rail);
    padding: 4px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  #content { padding: 26px 28px 60px; max-width: 980px; }
  .module-panel { display: none; }
  .module-panel.active { display: block; }

  .module-header { margin-bottom: 22px; }
  .module-header .eyebrow {
    color: var(--accent, var(--text-dim));
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .module-header h2 { font-size: 24px; margin: 0 0 6px; }
  .module-header p { color: var(--text-dim); font-size: 13.5px; margin: 0; max-width: 60ch; line-height: 1.5; }

  /* ---------- ticket stub (shared signature card) ---------- */
  .stub {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 16px 16px 14px;
    margin-bottom: 14px;
    background-image: repeating-linear-gradient(to right, transparent 0 6px, rgba(0,0,0,0.07) 6px 7px);
    background-size: 13px 100%;
    background-position: top;
    background-repeat: repeat-x;
  }
  .stub .tag {
    position: absolute;
    top: 12px; right: 14px;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 1px 7px;
    border-radius: 3px;
    transform: rotate(-6deg);
  }
  .stub h3 { font-size: 16px; margin: 0 0 4px; padding-right: 76px; }
  .stub .meta { font-size: 11.5px; opacity: 0.65; margin-bottom: 8px; }
  .stub .body-text { font-size: 13.5px; line-height: 1.5; }
  .stub .stub-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(35,38,31,0.25);
  }
  .stub button.mini {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn-solid { background: var(--accent); color: #fff; }
  .btn-outline { background: transparent; border: 1px solid rgba(35,38,31,0.3) !important; color: var(--ink); }

  /* overview grid */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .overview-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 18px 16px;
    cursor: pointer;
    position: relative;
    background-image: repeating-linear-gradient(to right, transparent 0 6px, rgba(0,0,0,0.07) 6px 7px);
    background-size: 13px 100%;
    background-position: top;
    background-repeat: repeat-x;
    transition: transform 0.12s ease;
  }
  .overview-card:hover { transform: translateY(-2px); }
  .overview-card .corner {
    position: absolute; top: 12px; right: 12px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .overview-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 8px; }
  .overview-card .big-num { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; line-height: 1; }
  .overview-card .sub { font-size: 12.5px; opacity: 0.7; margin-top: 6px; }

  /* progress bars (training) */
  .progress-track {
    background: rgba(35,38,31,0.12);
    border-radius: 20px;
    height: 6px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 20px; }
  .video-thumb {
    width: 54px; height: 38px;
    border-radius: 4px;
    background: var(--accent);
    opacity: 0.35;
    flex-shrink: 0;
  }

  /* payroll table-ish */
  .pay-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px dashed rgba(35,38,31,0.2);
    font-size: 13.5px;
  }
  .pay-row:last-child { border-bottom: none; }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 120px;
    margin: 6px 0 4px;
  }
  .bar-chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar-chart .bar {
    width: 100%;
    max-width: 34px;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
    opacity: 0.85;
  }
  .bar-chart .bar-label { font-size: 10.5px; color: var(--text-dim); }

  /* comms thread */
  .thread-msg { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
  .avatar-dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel-light);
    border: 1px solid var(--rail);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .thread-bubble {
    background: var(--panel-light);
    border: 1px solid var(--rail);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13.5px;
    max-width: 420px;
  }
  .thread-name { font-size: 11.5px; color: var(--text-dim); margin-bottom: 2px; }

  input[type=text], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--rail);
    color: var(--text-bright);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
  }
  button.primary-action {
    background: var(--accent, var(--scheduling));
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  @media (max-width: 760px) {
    #shell { flex-direction: column; }
    #sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      padding: 12px;
      gap: 8px;
      border-right: none;
      border-bottom: 1px solid var(--rail);
    }
    .brand { display: none; }
    .nav-divider { display: none; }
    .nav-stub { flex-shrink: 0; white-space: nowrap; }
    #content { padding: 20px 16px 50px; }
  }

  /* ---------- portfolio (multi-restaurant) view ---------- */
  #backToPortfolio {
    background: none;
    border: 1px solid var(--rail);
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #backToPortfolio:hover { color: var(--text-bright); border-color: var(--text-bright); }
  #portfolioTopbar {
    padding: 24px 32px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
  }
  .portfolio-eyebrow { color: var(--text-dim); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  #portfolioTopbar h1 { font-size: 26px; margin: 0; text-transform: none; }
  #portfolioContent { padding: 10px 32px 60px; max-width: 1040px; }
  .restaurant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .restaurant-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 18px 18px 16px;
    cursor: pointer;
    position: relative;
    background-image: repeating-linear-gradient(to right, transparent 0 6px, rgba(0,0,0,0.07) 6px 7px);
    background-size: 13px 100%;
    background-position: top;
    background-repeat: repeat-x;
    transition: transform 0.12s ease;
  }
  .restaurant-card:hover { transform: translateY(-2px); }
  .restaurant-card .status-tag {
    position: absolute; top: 14px; right: 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 3px;
    border: 2px solid;
    transform: rotate(-5deg);
  }
  .status-tag.ok { color: var(--payroll); border-color: var(--payroll); }
  .status-tag.attention { color: var(--scheduling); border-color: var(--scheduling); }
  .restaurant-card h3 { font-size: 17px; margin: 0 0 2px; padding-right: 90px; }
  .restaurant-card .city { font-size: 12px; opacity: 0.6; margin-bottom: 14px; }
  .restaurant-card .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-top: 1px dashed rgba(35,38,31,0.2);
  }
  .restaurant-card .stat-row:first-of-type { border-top: none; }
  .restaurant-card .note {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.75;
    line-height: 1.4;
  }
  .portfolio-totals {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .portfolio-totals .total-item .num { font-size: 22px; font-weight: 600; display: block; }
  .portfolio-totals .total-item .label { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>

<div id="portfolioView">
  <div id="portfolioTopbar">
    <div>
      <div class="portfolio-eyebrow" id="portfolioEyebrow">Your restaurants</div>
      <h1 id="portfolioGreeting">Good morning</h1>
    </div>
    <div class="topbar-right">
      <div class="lang-switch" id="langSwitchPortfolio"></div>
      <span class="demo-badge" id="demoBadgePortfolio">Sample data · demo</span>
    </div>
  </div>
  <div id="portfolioContent"></div>
</div>

<div id="shell" style="display:none">
  <nav id="sidebar"></nav>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button id="backToPortfolio" onclick="showPortfolio()">← All restaurants</button>
        <h1 id="topbarTitle">Overview</h1>
      </div>
      <div class="topbar-right">
        <div class="lang-switch" id="langSwitchApp"></div>
        <span class="demo-badge" id="demoBadgeApp">Sample data · demo</span>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

function t(path, ...args) {
  const parts = path.split(".");
  let node = T[LANG];
  for (const p of parts) node = node && node[p];
  if (typeof node === "function") return node(...args);
  return node != null ? node : path;
}

function generateAiResponse(q) {
  const lower = q.toLowerCase();
  const costWords = /cost|margin|labor|food|beverage|profit|coût|marge|main-d'œuvre|main d'oeuvre|nourriture|boisson|costo|margen|mano de obra|comida|bebida|beneficio/;
  const shiftWords = /shift|staff|schedul|cover|understaff|quart|personnel|horaire|manque|remplacement|turno|horario|cobertura|falta/;
  const trainWords = /train|course|onboard|manual|contract|formation|cours|intégration|contrat|capacitaci|curso|incorporaci|contrato/;
  const hireWords = /hir|candidate|applicant|interview|posting|embauche|candidat|entrevue|affichage|contrataci|candidato|entrevista|publicaci/;

  if (costWords.test(lower)) return t("comms.respCost", DATA.payroll.pnl);
  if (shiftWords.test(lower)) return tf(DATA.scheduling.forecast.detail) + " " + tf(DATA.scheduling.forecast.suggestion);
  if (trainWords.test(lower)) {
    const behind = DATA.training.courses.filter(c => c.completed < c.assigned).map(c => tf(c.title)).join(", ");
    return (behind ? t("comms.respTrainingBehind", behind) : t("comms.respTrainingCaughtUp")) + " " + t("comms.respTrainingContract");
  }
  if (hireWords.test(lower)) {
    const open = DATA.hiring.filter(h => h.stageKey !== "offer").length;
    return t("comms.respHiring", open);
  }
  return t("comms.respFallback");
}

function askAgent() {
  const input = document.getElementById("aiInput");
  const question = input.value.trim();
  if (!question) return;
  DATA.comms.aiThread.push({ role: "user", text: { en: question, fr: question, es: question } });
  DATA.comms.aiThread.push({ role: "ai", text: { en: generateAiResponse(question), fr: generateAiResponse(question), es: generateAiResponse(question) } });
  input.value = "";
  document.getElementById("aiThreadWrap").innerHTML = renderAiThread();
}
